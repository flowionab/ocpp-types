name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Derive version from tag and check it matches Cargo.toml
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match workspace.package.version ($cargo_version) in Cargo.toml"
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
      - name: Check CHANGELOG.md has a section for this version
        run: |
          if ! grep -q "^## \[${{ steps.version.outputs.version }}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [${{ steps.version.outputs.version }}]' section."
            exit 1
          fi

  test:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo build -p ocpp-types --features alloc
      - run: cargo test -p ocpp-types --features serde
      - run: cargo test -p ocpp-types --features alloc
      - run: cargo test -p ocpp-types --features serde,alloc
      - run: ./scripts/generate.sh
      - name: Fail if generated types differ from what's committed
        run: |
          if ! git diff --exit-code -- crates/ocpp-types/src/v16 crates/ocpp-types/src/v201 crates/ocpp-types/src/v21; then
            echo "Generated types are out of date. Run ./scripts/generate.sh and commit the result."
            exit 1
          fi

  publish:
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish -p ocpp-types --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract CHANGELOG section for this version
        run: |
          awk -v ver="${{ needs.verify.outputs.version }}" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
