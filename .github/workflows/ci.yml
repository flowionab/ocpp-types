name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo build -p ocpp-types --no-default-features
      - run: cargo test --workspace
      - run: cargo build -p ocpp-types --features alloc
      - run: cargo test -p ocpp-types --features serde
      - run: cargo test -p ocpp-types --no-default-features
      - run: cargo test -p ocpp-types --no-default-features --features serde
      - run: cargo test -p ocpp-types --features chrono
      # The alloc+serde combination has caught real bugs the other configs
      # didn't (cfg-gating that only conflicts once both const-generic and
      # alloc code paths are compiled together), so it's covered on its own.
      - run: cargo test -p ocpp-types --features serde,alloc
      - run: cargo test -p ocpp-types --features serde,alloc,chrono
      # `validate` generates a second impl per type under the same alloc
      # split as the struct itself, so both sides of that split need
      # building -- an impl gated wrong only collides in one of them.
      - run: cargo test -p ocpp-types --features validate
      - run: cargo test -p ocpp-types --no-default-features --features validate
      - run: cargo test -p ocpp-types --features validate,serde,alloc

  generated-types-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/generate.sh
      - name: Fail if generated types differ from what's committed
        run: |
          if ! git diff --exit-code -- crates/ocpp-types/src/v16 crates/ocpp-types/src/v201 crates/ocpp-types/src/v21; then
            echo
            echo "Generated types are out of date. Run ./scripts/generate.sh and commit the result."
            exit 1
          fi

  msrv:
    # The manifest's `rust-version` is a promise to consumers; without a build
    # at that version it is only a comment. `ocpp-codegen` needs 1.88, so this
    # checks the published crate alone.
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ocpp-types --all-features
      - run: cargo build -p ocpp-types --no-default-features
