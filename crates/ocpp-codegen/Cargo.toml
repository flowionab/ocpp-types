[package]
name = "ocpp-codegen"
version.workspace = true
edition.workspace = true
# Higher than the workspace floor: this crate uses let-chains. It is a
# dev-time tool and is never published, so it does not constrain consumers.
rust-version = "1.88"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
anyhow = "1"
quote = "1"
proc-macro2 = "1"
prettyplease = "0.3"
syn = { version = "3", features = ["full"] }