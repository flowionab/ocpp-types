[package]
name = "ocpp-codegen"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
anyhow = "1"
quote = "1"
proc-macro2 = "1"
prettyplease = "0.3"
syn = { version = "3", features = ["full"] }